<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Vokabeltrainer</title><style>body{font-family:system-ui;margin:0;background:#eff6ff;color:#1e293b}.app{max-width:720px;margin:auto;padding:18px}.card{background:white;padding:22px;border-radius:22px;box-shadow:0 5px 18px #0001;margin:12px 0}button,input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #cbd5e1}button{cursor:pointer}.primary{background:#2563eb;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.hide{display:none}.word{text-align:center;font-size:36px;font-weight:750;margin:32px 0}.msg{text-align:center;padding:12px;border-radius:12px;margin:12px 0}.good{background:#dcfce7}.bad{background:#ffe4e6}.near{background:#fef3c7}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:16px 0}.small{font-size:13px;color:#64748b}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}@media(max-width:500px){.app{padding:12px}.grid{grid-template-columns:1fr}.nav button{padding:10px 4px;font-size:13px}}</style></head><body><div class="app"><h1>📚 Vokabeltrainer</h1><div class="nav"><button onclick="show('learn')">Lernen</button><button onclick="show('words')">Wörter</button><button onclick="show('settings')">⚙️ Einstellungen</button></div><section id="learn" class="card"><div class="small" id="direction"></div><div class="word" id="prompt">–</div><div style="display:flex;gap:8px"><input id="answer" style="flex:1" placeholder="Antwort eingeben"><button class="primary" onclick="check()">Prüfen</button></div><div id="feedback"></div><div class="grid"><button onclick="rate('hard')">😕 Noch schwierig</button><button onclick="rate('ok')">🙂 Geht so</button><button onclick="rate('known')">⭐ Kann ich!</button></div><div class="stat card"><div>🟢<br><b id="safe">0</b><br><small>Sicher</small></div><div>🟡<br><b id="mid">0</b><br><small>Üben</small></div><div>🔴<br><b id="hard">0</b><br><small>Schwierig</small></div></div></section><section id="words" class="card hide"><h2>Vokabeln</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="de" placeholder="Deutsch"><input id="en" placeholder="Englisch"><button class="primary" onclick="add()">Hinzufügen</button></div><div id="list"></div></section><section id="settings" class="card hide"><h2>⚙️ Einstellungen</h2><div class="row"><label><b>Groß-/Kleinschreibung beachten</b><div class="small">Aus: School = school</div></label><input type="checkbox" id="case"></div><div class="row"><label><b>Kleine Tippfehler erlauben</b><div class="small">Ein Buchstabe Abweichung bei längeren Wörtern</div></label><input type="checkbox" id="typo" checked></div><div class="row"><label><b>Schwierige häufiger zeigen</b></label><input type="checkbox" id="boost" checked></div><div class="row"><label><b>Lernrichtung</b></label><select id="dir"><option value="mixed">Zufällig</option><option value="de-en">Deutsch → Englisch</option><option value="en-de">Englisch → Deutsch</option></select></div><button onclick="resetProgress()">Lernstand zurücksetzen</button></section></div><script>
let words=JSON.parse(localStorage.getItem('vt_words2')||'null')||[{id:1,de:'Regel',en:'rule',score:0,wrong:0},{id:2,de:'Schule',en:'school',score:0,wrong:0},{id:3,de:'anders',en:'different',score:0,wrong:0}];
let settings=JSON.parse(localStorage.getItem('vt_settings2')||'null')||{caseSensitive:false,typo:true,boost:true,dir:'mixed'};let current=null,direction='de-en';
const $=x=>document.getElementById(x); function save(){localStorage.setItem('vt_words2',JSON.stringify(words));localStorage.setItem('vt_settings2',JSON.stringify(settings));stats();renderList()}
function show(id){['learn','words','settings'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function lev(a,b){let d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function pick(){if(!words.length){current=null;$('prompt').textContent='Bitte Vokabeln hinzufügen';return}let pool=[];words.forEach(w=>{let n=w.score>=4?1:(settings.boost&&(w.score<0||w.wrong>=2)?9:3);for(let i=0;i<n;i++)pool.push(w)});let n=pool[Math.floor(Math.random()*pool.length)];if(words.length>1&&current&&n.id===current.id)return pick();current=n;direction=settings.dir==='mixed'?(Math.random()<.5?'de-en':'en-de'):settings.dir;$('direction').textContent=direction==='de-en'?'Deutsch → Englisch':'Englisch → Deutsch';$('prompt').textContent=direction==='de-en'?current.de:current.en;$('answer').value='';$('feedback').innerHTML=''}
function norm(s){s=s.trim();return settings.caseSensitive?s:s.toLowerCase()}
function check(){if(!current)return;let e=direction==='de-en'?current.en:current.de,a=$('answer').value;if(!a.trim())return;let exact=norm(a)===norm(e),near=!exact&&settings.typo&&e.length>=5&&lev(norm(a),norm(e))<=1;if(exact){current.score++;$('feedback').innerHTML='<div class="msg good">✅ Richtig!</div>'}else if(near){$('feedback').innerHTML='<div class="msg near">🟡 Fast richtig! Richtig: <b>'+e+'</b></div>'}else{current.score-=2;current.wrong++;$('feedback').innerHTML='<div class="msg bad">❌ Richtig wäre: <b>'+e+'</b></div>'}save()}
function rate(t){if(!current)return;if(t==='hard')current.score=Math.min(current.score,-2);if(t==='ok')current.score++;if(t==='known')current.score=Math.max(current.score+2,4);save();pick()}
function add(){let de=$('de').value.trim(),en=$('en').value.trim();if(!de||!en)return;words.push({id:Date.now(),de,en,score:0,wrong:0});$('de').value='';$('en').value='';save();pick()}
function renderList(){$('list').innerHTML=words.map(w=>'<div class="row"><span><b>'+w.de+'</b> → '+w.en+' <small>'+(w.score>=4?'🟢':(w.score<0||w.wrong>=3?'🔴':'🟡'))+'</small></span><button onclick="del('+w.id+')">🗑️</button></div>').join('')}
function del(id){words=words.filter(w=>w.id!==id);save();pick()} function stats(){$('safe').textContent=words.filter(w=>w.score>=4).length;$('hard').textContent=words.filter(w=>w.score<0||w.wrong>=3).length;$('mid').textContent=words.filter(w=>w.score>=0&&w.score<4).length}
function resetProgress(){words.forEach(w=>{w.score=0;w.wrong=0});save();pick()}
['case','typo','boost','dir'].forEach(id=>$(id).addEventListener('change',()=>{settings.caseSensitive=$('case').checked;settings.typo=$('typo').checked;settings.boost=$('boost').checked;settings.dir=$('dir').value;save();pick()}));$('case').checked=settings.caseSensitive;$('typo').checked=settings.typo;$('boost').checked=settings.boost;$('dir').value=settings.dir;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});renderList();stats();pick();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
